# The intelligence layer's local stack. Yours to change.
#
#   pnpm --filter @sagas/graph-api db:up       start it
#   pnpm --filter @sagas/graph-api db:verify   confirm it works
#   pnpm --filter @sagas/graph-api db:down     stop it, data survives
#   pnpm --filter @sagas/graph-api db:reset    delete the data and start over
#
# One service, because that is all this layer needs. The other two layers have
# their own files on their own ports, so nothing you do here can break their
# setup and nothing they do can break yours. If you need another service, add it
# here.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sagas-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sagas
      POSTGRES_PASSWORD: sagas
      POSTGRES_DB: sagas_intelligence
    ports:
      # Bound to 127.0.0.1 on purpose. Docker publishes on every interface by
      # default, which would put a database with the password "sagas" on
      # whatever network you are sitting on.
      #
      # 5434 on the host. Content uses 5433 and experience uses 5435, so all
      # three can run at once without colliding.
      - "127.0.0.1:5434:5432"
    volumes:
      - intelligence-pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagas -d sagas_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intelligence-pgdata:
