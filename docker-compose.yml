# Local development database.
#
# This gives you a Postgres instance with PostGIS enabled and an empty
# database. The tables are not here on purpose. Designing how this data is
# stored is a deliverable, not something the scaffold decides for you.
#
#   pnpm db:up       start it
#   pnpm db:verify   confirm it works and PostGIS is available
#   pnpm db:down     stop it (data survives)
#   pnpm db:reset    delete the database data (object storage is left alone)
#
# There is also object storage for the content layer, which does NOT start by
# default because most people do not need it:
#
#   pnpm storage:up      start it
#   pnpm storage:verify  confirm it works and make the bucket
#
# It sits behind a compose profile, so `pnpm db:up` stays one container for the
# teams who only need a database.
#
# Nothing here talks to a cloud service. There are no credentials to request.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sagas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sagas
      POSTGRES_PASSWORD: sagas
      POSTGRES_DB: sagas
    ports:
      # 5433 on the host, not 5432, so this does not collide with a Postgres
      # you may already be running for something else.
      - "5433:5432"
    volumes:
      - sagas-pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagas -d sagas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Object storage. Content layer only, hence the profile.
  # ------------------------------------------------------------------
  #
  # Speaks the S3 API, which is the entire point. Everything written against
  # this works unchanged against S3, R2, or B2 later, because the code only ever
  # sees an S3 client pointed at a different endpoint.
  #
  # Files do not go in Postgres. A 600MB WAV in a database column will make
  # every backup, every restore, and every query on that table slow, and you
  # cannot stream a range out of it to seek in an audio player.
  minio:
    image: minio/minio:latest
    container_name: sagas-minio
    profiles: ["media"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sagas
      MINIO_ROOT_PASSWORD: sagas-dev-secret
    ports:
      # 9000 is the S3 API. This is the one your code talks to.
      - "9000:9000"
      # 9001 is a file browser. Useful for eyeballing what you uploaded.
      # Administration happens through the `mc` command line, not here.
      - "9001:9001"
    volumes:
      - sagas-minio:/data

  # The MinIO command line, for making buckets and looking around. It is not a
  # server. It runs, does one thing, and exits, which is why nothing starts it
  # automatically.
  #
  #   docker compose --profile media run --rm mc 'mc ls local'
  mc:
    image: minio/mc:latest
    profiles: ["media"]
    depends_on:
      - minio
    environment:
      # mc reads connection details from the environment, so there is no
      # `mc alias set` step and no config file to go stale.
      MC_HOST_local: http://sagas:sagas-dev-secret@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc ls local"]

volumes:
  sagas-pgdata:
  sagas-minio:
